name: Deploy Web Scanner to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'web/**'
      - 'mod_scanner/**'
      - 'config.yaml'
      - '.cache/reference_hashes.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Web Assets
        run: |
          mkdir -p web
          cp config.yaml web/config.yaml
          if [ -f .cache/reference_hashes.json ]; then
            cp .cache/reference_hashes.json web/reference_hashes.json
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
